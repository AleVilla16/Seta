<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>I miei turni</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b6cff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Turni"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"><style>
:root{--bg:#f4f5fa;--c:#fff;--t:#0f172a;--m:#6b7280;--l:#e7e9f1;--a:#3b6cff;--w:#f3f5fb;--on:#fff;--sh:0 10px 30px rgba(30,41,90,.09);--s:color-mix(in srgb,var(--a) 13%,transparent);--g:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 50%,#a06bff));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0e1a;--c:#131a2b;--t:#eef1f8;--m:#8b95ab;--l:#232c44;--w:#18213a;--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#0a0e1a;--c:#131a2b;--t:#eef1f8;--m:#8b95ab;--l:#232c44;--w:#18213a;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 340px at 50% -80px,color-mix(in srgb,var(--a) 22%,transparent),transparent) no-repeat,var(--bg);color:var(--t);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 140px}
h2{margin:8px 2px 14px;font-size:26px;font-weight:800;letter-spacing:-.02em}h3{margin:22px 2px 10px;font-size:16px;font-weight:700}
button,input,select,textarea{font:inherit;color:var(--t)}
button{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:10px 14px;cursor:pointer;font-weight:600;transition:transform .12s}
button:active{transform:scale(.96)}
button.p{background:var(--g);color:#fff;border:0;box-shadow:0 8px 18px color-mix(in srgb,var(--a) 35%,transparent)}
input,select,textarea{background:var(--w);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%;min-width:0;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--a);background:var(--c)}
.m{color:var(--m);font-size:13px}.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}.r>button{flex:0 0 auto}
.card{background:var(--c);border:0;border-radius:20px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;width:100%;text-align:left;box-shadow:var(--sh)}
.card b{display:flex;align-items:center;gap:12px}.ic{width:40px;height:40px;border-radius:12px;background:var(--s);display:grid;place-items:center;font-size:19px}
.bx,.cc{background:var(--c);border-radius:22px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;min-height:112px;padding:12px 18px;border-radius:26px;background:var(--g);box-shadow:0 14px 30px color-mix(in srgb,var(--a) 32%,transparent)}
.hd img{height:64px;width:64px;border-radius:16px;box-shadow:0 6px 16px #0003}.hd img.bus{height:auto;width:auto;max-width:66%;max-height:84px;border-radius:0;box-shadow:none;filter:drop-shadow(0 8px 8px #0003)}.hd svg{height:52px;width:auto}.hd button{background:#ffffff30;color:#fff;border:0}
.tc{display:flex;justify-content:space-between;align-items:center;background:var(--c);border-radius:22px;padding:14px 18px;margin-bottom:12px;box-shadow:var(--sh)}
.tc b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}.tc>span{font-weight:700;color:var(--a);background:var(--s);padding:6px 12px;border-radius:12px}.tc>span:empty{display:none}
.cn{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}.cn b{font-size:18px;font-weight:800}.cn button{width:38px;height:38px;padding:0;border-radius:50%;background:var(--w);border:0;font-size:20px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.g>div{text-align:center;font-size:11px;font-weight:600;color:var(--m);padding:4px 0}
.g>button{border:0;background:transparent;border-radius:14px;min-height:66px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden}
.g>button.we{background:var(--w)}
.g i{font-style:normal;font-size:12px;font-weight:600;color:var(--m)}
.g b{font-size:12.5px;padding:1px 7px;border-radius:8px;background:var(--s);color:var(--a)}.g b:empty{display:none}
.g small{font-size:9.5px;line-height:1.15;color:var(--m)}
.g>button.td{background:var(--g);box-shadow:0 8px 16px color-mix(in srgb,var(--a) 35%,transparent)}
.td i,.td small{color:#ffffffe6}.td b{background:#ffffff33;color:#fff}
table{width:100%;border-collapse:collapse;margin-bottom:8px}th{font-size:12px;text-align:left;color:var(--m);font-weight:600;padding:4px}
td{padding:3px}td button{padding:8px 11px}
.f{display:grid;gap:10px;margin:10px 0}.f label{font-size:13px;color:var(--m);display:grid;gap:5px}
#md{display:none;position:fixed;inset:0;background:#0a0e1a80;backdrop-filter:blur(4px);z-index:20;align-items:flex-end;justify-content:center}#md.on{display:flex}
.mb{background:var(--c);width:100%;max-width:640px;border-radius:28px 28px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.mb:before{content:"";width:40px;height:4px;border-radius:2px;background:var(--l);justify-self:center;margin-top:-10px}
.mb h3{margin:0;text-transform:capitalize;font-size:19px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;z-index:10;background:color-mix(in srgb,var(--c) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--l);border-radius:30px;box-shadow:0 14px 34px rgba(20,30,70,.16);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 8px}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--m);flex:1;padding:4px 0;border-radius:16px}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--a)}
nav button.h{flex:0 0 64px;height:64px;margin-top:-34px;border-radius:50%;background:var(--g);color:#fff;justify-content:center;box-shadow:0 12px 24px color-mix(in srgb,var(--a) 45%,transparent)}
nav button.h svg{width:28px;height:28px}

ate-columns:repeat(7,1fr);gap:4px;margin:8px 0}.pg>div{text-align:center;font-size:11px;font-weight:600;color:var(--m)}.pg>button{min-height:38px;border-radius:10px;border:1px solid var(--l);background:var(--c);color:var(--t);font-size:14px}.pg>button.on{background:var(--a);color:#fff;border-color:var(--a)}.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0}.wk>button{min-height:38px;border-radius:10px;border:1px solid var(--l);background:var(--c);color:var(--t);font-size:12px;padding:0}.wk>button.on{background:var(--a);color:#fff;border-color:var(--a)}</style></head><body><main id="v"></main><input id=ph type=file accept="image/jpeg,image/png,image/webp,image/heic,image/heif" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0" tabindex=-1 onchange="scan(this)"><div id="md"></div><nav id="nb"></nav>
